services:
  - type: web
    name: devicepulse-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: devicepulse
      - key: ENVIRONMENT
        value: production
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: EMERGENT_PUSH_KEY
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: REVENUECAT_ENTITLEMENT_ID
        value: pro
      - key: CORS_ORIGINS
        sync: false
